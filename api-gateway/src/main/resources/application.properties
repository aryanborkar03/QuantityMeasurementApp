# ── SERVER ─────────────────────────────────────────
server.port=${PORT:8080}

# ── APPLICATION ────────────────────────────────────
spring.application.name=api-gateway

# IMPORTANT: Ensure forwarded headers are respected
server.forward-headers-strategy=FRAMEWORK

# ── CORS ───────────────────────────────────────────────────────
# FIX: This value is read by gateway SecurityConfig via @Value("${app.cors.allowed-origins}").
# Without it, the CorsConfigurationSource bean uses the @Value default (localhost:5173),
# but it may conflict with the spring.cloud.gateway.globalcors config below.
# Keeping them in sync prevents double-CORS-handling issues on the OAuth2 callback.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── GATEWAY CORS ───────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Accept,X-Requested-With,Origin
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# ── ROUTES ─────────────────────────────────────────

# ✅ FIXED AUTH SERVICE ROUTE (MAIN CHANGE HERE)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:lb://auth-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/oauth2/**,/login/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[0].filters[1]=PreserveHostHeader

# QMA Public
spring.cloud.gateway.routes[1].id=qma-public
spring.cloud.gateway.routes[1].uri=${QMA_SERVICE_URI:lb://qma-service}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/quantities/compare,/api/v1/quantities/convert,/api/v1/quantities/add,/api/v1/quantities/subtract,/api/v1/quantities/divide
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[1].filters[1]=OptionalJwtAuthFilter

# QMA User Scoped (JWT)
spring.cloud.gateway.routes[2].id=qma-user-scoped
spring.cloud.gateway.routes[2].uri=${QMA_SERVICE_URI:lb://qma-service}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/quantities/me/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[2].filters[1]=JwtAuthFilter

# QMA History (JWT)
spring.cloud.gateway.routes[3].id=qma-history
spring.cloud.gateway.routes[3].uri=${QMA_SERVICE_URI:lb://qma-service}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/quantities/history/**,/api/v1/quantities/count/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[3].filters[1]=JwtAuthFilter

# QMA Protected (JWT)
spring.cloud.gateway.routes[4].id=qma-protected
spring.cloud.gateway.routes[4].uri=${QMA_SERVICE_URI:lb://qma-service}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/quantities/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[4].filters[1]=JwtAuthFilter

# ── REACTIVE MODE ──────────────────────────────────
spring.main.web-application-type=reactive

# ── JWT CONFIG ─────────────────────────────────────
app.jwt.secret=${JWT_SECRET:UXVhbnRpdHlNZWFzdXJlbWVudEFwcF9TZWN1cmVKd3RLZXlfRm9yRGV2ZWxvcG1lbnRfMjAyNiEh}

# ── ACTUATOR ──────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# ── LOGGING ───────────────────────────────────────
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.app.gateway=DEBUG

# ── EUREKA ────────────────────────────────────────
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── SPRING BOOT ADMIN CLIENT ──────────────────────
spring.boot.admin.client.enabled=${ADMIN_CLIENT_ENABLED:true}
spring.boot.admin.client.url=http://${ADMIN_HOST:localhost}:${ADMIN_PORT:8090}
spring.boot.admin.client.instance.name=api-gateway
spring.boot.admin.client.instance.prefer-ip=true
