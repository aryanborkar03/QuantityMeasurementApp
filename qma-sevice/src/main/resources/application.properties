# ── APPLICATION ───────────────────────────────────
spring.application.name=qma-service
server.port=8082
spring.profiles.active=dev

# ── H2 DATABASE ───────────────────────────────────
spring.datasource.url=jdbc:h2:mem:qmadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── REDIS CONFIG ──────────────────────────────────
# Ensure Redis Desktop or Docker Redis is running on port 6379
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
app.cache.ttl-seconds=600

# ── EUREKA CLIENT ─────────────────────────────────
# FIXED: Using localhost and added trailing slash for better discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Better discovery settings for local development
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── SPRING BOOT ADMIN CLIENT CONFIG ────────────────
spring.boot.admin.client.enabled=true
spring.boot.admin.client.url=http://localhost:8090
spring.boot.admin.client.instance.prefer-ip=true

# ADD THESE TWO LINES:
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin

# ── ACTUATOR & MONITORING ─────────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.post.enabled=true
management.endpoint.loggers.enabled=true

# ── SWAGGER / OPENAPI ─────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── LOGGING ───────────────────────────────────────
logging.level.com.app.qma=DEBUG