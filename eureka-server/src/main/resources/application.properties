# ── APPLICATION ───────────────────────────────────
spring.application.name=eureka-server
server.port=${PORT:${EUREKA_PORT:8761}}

# ── CREDENTIALS ───────────────────────────────────
eureka.dashboard.username=${EUREKA_USERNAME}
eureka.dashboard.password=${EUREKA_PASSWORD}

# ── EUREKA SERVER CONFIG ──────────────────────────
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${EUREKA_HOST:localhost}}
eureka.server.eviction-interval-timer-in-ms=5000

# ── ACTUATOR ──────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── LOGGING ───────────────────────────────────────
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
logging.level.com.app.eureka=DEBUG
