# ── APPLICATION ───────────────────────────────────
spring.application.name=auth-service
server.port=${PORT:8081}

# ── CRITICAL: Forwarded Headers ───────────────────
# auth-service runs on 8081 behind the gateway on 8080.
# FRAMEWORK mode makes Spring read X-Forwarded-Host/Port/Proto so that
# {baseUrl} in the OAuth2 redirect-uri resolves to localhost:8080 (gateway),
# not localhost:8081. Without this, Google rejects the redirect URI.
server.forward-headers-strategy=FRAMEWORK

# ── JWT CONFIG ────────────────────────────────────
app.jwt.secret=${JWT_SECRET:UXVhbnRpdHlNZWFzdXJlbWVudEFwcF9TZWN1cmVKd3RLZXlfRm9yRGV2ZWxvcG1lbnRfMjAyNiEh}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── OAUTH2 CONFIG ─────────────────────────────────
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# FIX (OAuth2): Hardcode the redirect-uri instead of using {baseUrl} template.
# Root cause of ERR_TOO_MANY_REDIRECTS / Google "invalid_request" error:
#   Spring Cloud Gateway does NOT forward X-Forwarded-Host/X-Forwarded-Port headers
#   by default. The auth-service (port 8081) uses FRAMEWORK strategy which reads
#   X-Forwarded-Host first — if that header is missing or set to the internal
#   service name by Eureka, {baseUrl} resolves to http://auth-service or
#   http://localhost:8081 instead of http://localhost:8080.
#   Google then rejects the OAuth2 request because the redirect_uri sent
#   (http://localhost:8081/login/oauth2/code/google) does not match the one
#   registered in Google Cloud Console (http://localhost:8080/login/oauth2/code/google).
#   The callback comes back with error=invalid_request, Spring Security has no
#   failure handler wired to a non-looping path → redirect loop → ERR_TOO_MANY_REDIRECTS.
# Fix: hardcode the exact URI that IS registered in Google Cloud Console.
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
# Same fix for GitHub
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/login/oauth2/code/github}

# ── CORS ──────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── MAIL CONFIG ───────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true

# FIX (Email): Added starttls.required=true — without it Gmail silently falls back
# to a plaintext connection which Gmail rejects, causing mail to never send.
# Also removed the incorrect ssl.protocols property (only applies to SSL/465, not STARTTLS/587).
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Prevent silent hangs if Gmail SMTP is slow
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── DATABASE ──────────────────────────────────────
# Controlled by DB_PROFILE env var: "dev" (default) uses H2, "prod" uses MySQL.
# Set DB_PROFILE=prod in your .env or deployment environment to switch.
spring.profiles.active=${DB_PROFILE:dev}

# ── ACTUATOR & ADMIN CLIENT ───────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.post.enabled=true
management.endpoint.loggers.enabled=true
spring.boot.admin.client.enabled=${ADMIN_CLIENT_ENABLED:true}

# ── SWAGGER / OPENAPI ─────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── LOGGING ───────────────────────────────────────
logging.level.com.app.auth=DEBUG
logging.level.org.springframework.security=DEBUG

# ── EUREKA CLIENT ─────────────────────────────────
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
