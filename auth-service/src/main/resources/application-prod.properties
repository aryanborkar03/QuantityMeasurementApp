# ── PROD PROFILE (MySQL) ──────────────────────────

spring.datasource.url=jdbc:mysql://nozomi.proxy.rlwy.net:19199/railway?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000&socketTimeout=10000&defaultAuthenticationPlugin=com.mysql.cj.plugin.CachingSha2PasswordPlugin&authenticationPlugins=com.mysql.cj.plugin.CachingSha2PasswordPlugin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=${MYSQL_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console disabled in prod
spring.h2.console.enabled=false

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
