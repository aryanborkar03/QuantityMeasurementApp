# ── PROD PROFILE (MySQL) ──────────────────────────
# Active when DB_PROFILE=prod.
# Requires either MYSQL_JDBC_URL / DATABASE_URL / DB_URL / MYSQL_URL /
# MYSQL_PUBLIC_URL, or the split MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE,
# MYSQL_USERNAME, MYSQL_PASSWORD variables.

spring.datasource.url=${MYSQL_JDBC_URL:jdbc:mysql://${MYSQL_HOST:${MYSQLHOST:localhost}}:${MYSQL_PORT:${MYSQLPORT:3306}}/${MYSQL_DATABASE:${MYSQLDATABASE:qma_auth}}?useSSL=${MYSQL_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=10000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${MYSQL_PASSWORD:${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD:}}}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# update = safe for production (preserves data, applies schema changes)
# validate = strictest (fails on schema mismatch — use after schema is stable)
# create-drop = DEV ONLY — wipes data on restart, never use in prod
spring.jpa.hibernate.ddl-auto=${MYSQL_DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console is disabled in prod
spring.h2.console.enabled=false

# Connection pool (HikariCP defaults are good; tune if needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
