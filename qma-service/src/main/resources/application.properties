# ── APPLICATION ───────────────────────────────────
spring.application.name=qma-service
server.port=${PORT:8082}
spring.profiles.active=dev

# ── H2 DATABASE ───────────────────────────────────
spring.datasource.url=jdbc:h2:mem:qmadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── REDIS CONFIG ──────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
app.cache.ttl-seconds=600

# ── EUREKA CLIENT ─────────────────────────────────
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── SPRING BOOT ADMIN CLIENT CONFIG ────────────────
spring.boot.admin.client.enabled=${ADMIN_CLIENT_ENABLED:true}
spring.boot.admin.client.url=http://${ADMIN_HOST:localhost}:${ADMIN_PORT:8090}
spring.boot.admin.client.instance.prefer-ip=true
spring.boot.admin.client.username=${ADMIN_USERNAME}
spring.boot.admin.client.password=${ADMIN_PASSWORD}

# ── ACTUATOR & MONITORING ─────────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.post.enabled=true
management.endpoint.loggers.enabled=true

# ── SWAGGER / OPENAPI ─────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── LOGGING ───────────────────────────────────────
logging.level.com.app.qma=DEBUG
