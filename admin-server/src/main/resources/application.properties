# ── APPLICATION ───────────────────────────────────
spring.application.name=admin-server
server.port=${PORT:${ADMIN_PORT:8090}}

# ── ADMIN LOGIN ───────────────────────────────────
spring.security.user.name=${ADMIN_USERNAME}
spring.security.user.password=${ADMIN_PASSWORD}

# ── EUREKA ────────────────────────────────────────
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ── ACTUATOR ──────────────────────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ── LOGGING ───────────────────────────────────────
logging.level.de.codecentric.boot.admin=INFO
logging.level.com.app.admin=DEBUG
